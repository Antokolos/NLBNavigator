org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true

# ---- Самодостаточная игра (вариант сборки game). Книга: app/src/game/assets/book.nlbpack
# Идентификатор приложения в магазине (у каждой игры свой)
nlb.game.applicationId=com.nlbhub.servantofra
# Название под значком — в ресурсах (UTF-8 и на разных языках): app/src/game/res/values*/strings.xml.
# Здесь его не задаём: Gradle читает этот файл в ISO-8859-1, и кириллица превращается в мусор
# Параметры плеера: режим книги (vn или standard) и ключи nlb_sdl (--choices-in-text, --lang ru…)
nlb.game.args=standard
nlb.game.versionCode=1
nlb.game.versionName=1.0

# ---- Проигрыватель с каталогом (вариант player)
# Каталог игр: JSON (формат — android/README.md); до первого обновления — встроенный тестовый
nlb.player.catalogUrl=https://example.org/nlbnavigator/catalog.json

# Процессоры: arm64-v8a — телефоны, x86_64 — эмулятор Android Studio
nlb.abiFilters=arm64-v8a,x86_64
