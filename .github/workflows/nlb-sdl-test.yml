name: NLB SDL manual test

"on":
  workflow_dispatch:
    inputs:
      game_ref:
        description: "Branch, tag, or commit of nlbproject/wolfman"
        required: true
        default: "master"
        type: string
      reference_ref:
        description: "Branch, tag, or commit of nlbproject/instead-am_i_a_monster_vn"
        required: true
        default: "main"
        type: string
  push:
    branches:
      - ci/nlb-sdl-wolfman
    paths:
      - .github/workflows/nlb-sdl-test.yml
      - CMakeLists.txt
      - Source/NLBSdl/**
      - Source/NLBAudioSDL/**

permissions:
  contents: read

concurrency:
  group: nlb-sdl-manual-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-prepare:
    name: Build nlb_sdl and prepare test books
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GAME_REF: ${{ github.event.inputs.game_ref || 'master' }}
      REFERENCE_REF: ${{ github.event.inputs.reference_ref || 'main' }}
    steps:
      - name: Check out NLBNavigator
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools and Linux graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config git curl zip unzip tar \
            autoconf autoconf-archive automake libtool libltdl-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxss-dev libxt-dev libxv-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols \
            libegl1-mesa-dev libgl1-mesa-dev libdbus-1-dev libibus-1.0-dev \
            libudev-dev libasound2-dev libpulse-dev libsndio-dev libdecor-0-dev \
            libfreetype-dev python3-pil xvfb xauth \
            instead xdotool imagemagick x11-utils openbox

      - name: Install SDL3 dependencies with vcpkg
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          "$VCPKG_ROOT/vcpkg" install \
            sdl3 'sdl3-image[png,jpeg]' sdl3-ttf sdl3-mixer \
            --triplet x64-linux

      - name: Configure NLBNavigator
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DNLB_BUILD_APPS=ON \
            -DNLB_WITH_SDL3=ON

      - name: Build nlb_sdl
        run: |
          cmake --build build --target nlb_sdl --parallel 2
          test -x build/nlb_sdl

      - name: Smoke-test executable
        run: |
          set +e
          ./build/nlb_sdl > nlb_sdl-usage.log 2>&1
          result=$?
          set -e
          test "$result" -eq 1
          grep -q "Usage: nlb_sdl" nlb_sdl-usage.log
          cat nlb_sdl-usage.log

      - name: Check out wolfman with all nested modules
        run: |
          git clone --recurse-submodules --depth 1 --branch "$GAME_REF" \
            https://github.com/nlbproject/wolfman.git test-data/wolfman
          git -C test-data/wolfman submodule update --init --recursive
          test -d test-data/wolfman
          test -s test-data/wolfman/images/title.png
          test -s test-data/wolfman/images/1.png
          file test-data/wolfman/images/title.png test-data/wolfman/images/1.png
          find test-data/wolfman -maxdepth 2 -type f | head -n 30

      - name: Check out INSTEAD reference export
        run: |
          git clone --recurse-submodules --depth 1 --branch "$REFERENCE_REF" \
            https://github.com/nlbproject/instead-am_i_a_monster_vn.git test-data/instead-am_i_a_monster_vn
          git -C test-data/instead-am_i_a_monster_vn submodule update --init --recursive
          test -d test-data/instead-am_i_a_monster_vn
          test -s test-data/instead-am_i_a_monster_vn/luapassing.lua
          git -C test-data/instead-am_i_a_monster_vn log -1 --format='INSTEAD reference commit: %H %s'
          find test-data/instead-am_i_a_monster_vn -maxdepth 2 -type f | head -n 30

      - name: Check out INSTEAD base theme
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/instead-hub/instead.git test-data/instead
          git -C test-data/instead sparse-checkout set themes/default
          test -s test-data/instead/themes/default/theme.ini

      - name: Capture INSTEAD reference screenshots
        run: |
          mkdir -p test-results
          cat > test-results/capture-instead.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          workspace="${GITHUB_WORKSPACE:-$PWD}"
          game="$workspace/test-data/instead-am_i_a_monster_vn"
          bin="$(command -v sdl-instead || printf /usr/games/sdl-instead)"
          test -s "$game/luapassing.lua"
          test -s "$game/module_ru.lua"

          # Replace main.lua only in this disposable CI checkout to bypass the menu wrapper.
          cp "$game/main.lua" "$workspace/test-results/instead-menu-main.lua"
          cp "$game/module_ru.lua" "$game/main.lua"
          cd "$game"
          export LUA_PATH="$game/?.lua;$game/?/init.lua;;"
          printf 'Running standalone Russian game module: module_ru.lua\n' > "$workspace/test-results/instead-reference.log"

          # Use a real window manager so the game can receive keyboard focus reliably.
          openbox --sm-disable > "$workspace/test-results/openbox.log" 2>&1 &
          wm_pid=$!
          sleep 1
          "$bin" -nosound "$game" >> "$workspace/test-results/instead-reference.log" 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            kill "$wm_pid" 2>/dev/null || true
            wait "$wm_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          find_game_window() {
            local win geometry width height area best="" best_area=0
            while IFS= read -r win; do
              [ -n "$win" ] || continue
              geometry="$(xwininfo -id "$win" 2>/dev/null | awk '/Width:/{w=$2} /Height:/{h=$2} END{if(w&&h) print w, h}')"
              [ -n "$geometry" ] || continue
              read -r width height <<< "$geometry"
              area=$((width * height))
              if [ "$width" -ge 640 ] && [ "$height" -ge 400 ] && [ "$area" -gt "$best_area" ]; then
                best="$win"
                best_area="$area"
              fi
            done < <(xdotool search --onlyvisible --name ".*" 2>/dev/null || true)
            printf '%s' "$best"
          }

          win=""
          for attempt in $(seq 1 30); do
            win="$(find_game_window)"
            [ -n "$win" ] && break
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "INSTEAD exited before creating a visible window"
              cat "$workspace/test-results/instead-reference.log"
              cat "$workspace/test-results/openbox.log" || true
              exit 1
            fi
            sleep 0.5
          done
          if [ -z "$win" ]; then
            echo "Could not find visible INSTEAD window; X11 tree follows:"
            xwininfo -root -tree || true
            cat "$workspace/test-results/instead-reference.log" || true
            cat "$workspace/test-results/openbox.log" || true
            exit 1
          fi

          echo "INSTEAD window id: $win"
          xdotool getwindowname "$win" || true
          activate_game() {
            # Direct XSetInputFocus avoids waiting for EWMH activation support in headless Xvfb.
            xdotool windowfocus --sync "$win"
            echo "Focused X11 window: $(xdotool getwindowfocus 2>/dev/null || true)"
          }
          park_pointer() {
            xdotool mousemove --sync 1910 1070
            sleep 0.2
          }

          # Allow the startup dissolve to settle before taking the baseline screenshot.
          activate_game
          sleep 2
          park_pointer
          import -window "$win" "$workspace/test-results/instead-initial.png"

          # First input path: keyboard Space.
          activate_game
          xdotool key --clearmodifiers space
          sleep 2
          park_pointer
          import -window "$win" "$workspace/test-results/instead-after-space.png"

          # Second input path: click in the middle of the game viewport.
          activate_game
          xdotool mousemove --sync 960 540
          xdotool click --clearmodifiers 1
          sleep 2
          park_pointer
          import -window "$win" "$workspace/test-results/instead-after-click.png"
          SCRIPT
          chmod +x test-results/capture-instead.sh
          set +e
          timeout --signal=TERM 25s xvfb-run -a -s "-screen 0 1920x1080x24" bash test-results/capture-instead.sh
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            echo "INSTEAD reference capture failed with exit code $result"
            cat test-results/instead-reference.log || true
            exit "$result"
          fi
          python3 - <<'PY'
          from PIL import Image, ImageChops
          import sys

          paths = (
              "test-results/instead-initial.png",
              "test-results/instead-after-space.png",
              "test-results/instead-after-click.png",
          )
          images = {}
          for path in paths:
              with Image.open(path) as image:
                  rgb = image.convert("RGB")
                  colors = len(rgb.getcolors(maxcolors=2_000_000) or [])
                  images[path] = rgb.copy()
              print(f"{path}: {colors} distinct RGB colors")
              if colors < 1000:
                  sys.exit(f"INSTEAD screenshot appears blank: {path}")

          transitions = (
              ("Space", paths[0], paths[1]),
              ("mouse click", paths[1], paths[2]),
          )
          for action, before_path, after_path in transitions:
              diff = ImageChops.difference(images[before_path], images[after_path])
              changed_pixels = sum(1 for pixel in diff.getdata() if pixel != (0, 0, 0))
              fraction = changed_pixels / (images[before_path].width * images[before_path].height)
              print(f"INSTEAD {action}: {changed_pixels} changed pixels ({fraction:.3%})")
              if changed_pixels < 1000:
                  sys.exit(
                      f"INSTEAD did not visibly advance after {action}: "
                      f"only {changed_pixels} pixels changed"
                  )
          PY

      - name: Run scripted wolfman smoke test
        run: |
          mkdir -p test-results
          cat > test-data/wolfman-smoke.txt <<'EOF'
          # Verify the initial scene renders and the player processes a next-page input.
          wait:250
          shot:test-results/wolfman-initial.png
          key:space
          wait:250
          shot:test-results/wolfman-after-space.png
          EOF
          set +e
          timeout 60s xvfb-run -a env SDL_AUDIODRIVER=dummy \
            ./build/nlb_sdl test-data/wolfman explore vn --no-sound \
            --theme test-data/instead-am_i_a_monster_vn/themes/default \
            --base-theme test-data/instead/themes/default \
            --lang ru \
            --log test-results/wolfman-game.log \
            --window 1280x720 --script test-data/wolfman-smoke.txt \
            > test-results/wolfman-script.log 2>&1
          result=$?
          set -e
          cat test-results/wolfman-script.log
          test "$result" -eq 0
          test -s test-results/wolfman-initial.png
          test -s test-results/wolfman-after-space.png
          ! grep -q '\\[НЕ ВЫПОЛНЕНО\\]' test-results/wolfman-script.log
          grep -q 'Вы очнулись лежащим посреди тротуара' test-results/wolfman-game.log
          python3 - <<'PY'
          from PIL import Image
          import sys
          for path in ("test-results/wolfman-initial.png", "test-results/wolfman-after-space.png"):
              with Image.open(path) as image:
                  colors = len(image.convert("RGB").getcolors(maxcolors=2_000_000) or [])
              print(f"{path}: {colors} distinct RGB colors")
              if colors < 1000:
                  sys.exit(f"Screenshot appears blank or is missing the scene artwork: {path}")
          PY
          grep -q 'title.png' test-results/wolfman-game.log || true
          grep -q 'gfx/bg.jpg' test-results/wolfman-script.log || true

      - name: Validate INSTEAD reference export
        run: |
          test -s test-data/instead-am_i_a_monster_vn/main.lua
          test -d test-data/instead-am_i_a_monster_vn/images
          test -d test-data/instead-am_i_a_monster_vn/themes
          find test-data/instead-am_i_a_monster_vn/images -type f | grep -q .
          printf 'Reference export structure OK\\n' | tee test-results/reference-validation.log

      - name: Upload build and preparation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nlb-sdl-test-logs
          path: |
            nlb_sdl-usage.log
            build/CMakeCache.txt
            test-results/
            test-data/instead/themes/default/
          if-no-files-found: warn
          retention-days: 14
