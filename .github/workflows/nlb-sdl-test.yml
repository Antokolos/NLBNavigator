name: NLB SDL differential test

# Дифференциальные маршруты NLBNavigator ↔ INSTEAD (tests/differential, issue #28).
# build — nlb_sdl один раз (vcpkg с бинарным кэшем), plan — какие маршруты прогонять,
# route — матрица: каждый маршрут своим job в обоих движках и сравнение,
# report — общий артефакт nlb-sdl-test-logs и сводка по маршрутам.
# На push и pull request — только изменённые маршруты (или все, если изменились раннер, workflow,
# каталог или плеер); вручную и по расписанию — все (вручную можно выбрать маршруты). Документы
# (.md) маршрутов не выбирают; если в новом push в PR одни документы, маршруты не прогоняются.
# gate — итог одной проверкой (её можно сделать обязательной при защите main): успех, если
# маршруты прошли или законно не прогонялись. Фильтр путей ниже не пускает workflow для
# изменений вне плеера и тестов; при обязательной gate его нужно убрать, иначе такой PR будет
# ждать проверку, которая не запустится.

"on":
  workflow_dispatch:
    inputs:
      game_ref:
        description: "Commit SHA, branch, or tag of nlbproject/wolfman (default: pinned NLB reference)"
        required: true
        default: "888b4b7a7a564693274f53341728ee9f3b4c2879"
        type: string
      reference_ref:
        description: "Commit SHA, branch, or tag of INSTEAD export (default: pinned export)"
        required: true
        default: "0db8d2c611faa596987baaf041763ef6c9282484"
        type: string
      base_theme_ref:
        description: "Commit SHA, branch, or tag of instead-hub/instead base theme"
        required: true
        default: "1a07e0ffc0a1e8402b9d47a104d88d3f33204a7e"
        type: string
      routes:
        description: "Route ids from catalog.json, comma-separated (empty: all routes)"
        required: false
        default: ""
        type: string
  schedule:
    # полный прогон раз в неделю (понедельник, 03:17 UTC)
    - cron: "17 3 * * 1"
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/nlb-sdl-test.yml
      - CMakeLists.txt
      - Source/*
      - Source/NLBCore/**
      - Source/NLBReader/**
      - Source/NLBPresentation/**
      - Source/NLBSdl/**
      - Source/NLBAudioSDL/**
      - Source/thirdparty/**
      - tests/differential/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/nlb-sdl-test.yml
      - CMakeLists.txt
      - Source/*
      - Source/NLBCore/**
      - Source/NLBReader/**
      - Source/NLBPresentation/**
      - Source/NLBSdl/**
      - Source/NLBAudioSDL/**
      - Source/thirdparty/**
      - tests/differential/**

permissions:
  contents: read

# Прогон не отменяется новым коммитом: незаконченный прогон тоже даёт артефакт для разбора.
concurrency:
  group: nlb-sdl-test-${{ github.ref }}
  cancel-in-progress: false

env:
  GAME_REF: ${{ github.event.inputs.game_ref || '888b4b7a7a564693274f53341728ee9f3b4c2879' }}
  REFERENCE_REF: ${{ github.event.inputs.reference_ref || '0db8d2c611faa596987baaf041763ef6c9282484' }}
  BASE_THEME_REF: ${{ github.event.inputs.base_theme_ref || '1a07e0ffc0a1e8402b9d47a104d88d3f33204a7e' }}
  # vcpkg закреплён: от его коммита зависит ключ бинарного кэша
  VCPKG_COMMIT: 5363acb796e576328288fae60c25304e227e9839

jobs:
  validate:
    name: Validate route definitions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Static checks of catalog, routes and runner
        run: |
          python3 -m py_compile tests/differential/run_route.py tests/differential/validate_catalog.py \
            tests/differential/ci/select_routes.py
          python3 -m json.tool tests/differential/catalog.json > /dev/null
          for route in tests/differential/routes/*.json; do python3 -m json.tool "$route" > /dev/null; done
          python3 -m unittest discover -s tests/differential -p 'test_*.py'
          python3 tests/differential/validate_catalog.py
          python3 tests/differential/run_route.py --help > /dev/null

  plan:
    name: Select routes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      count: ${{ steps.select.outputs.count }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          ONLY: ${{ github.event.inputs.routes }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          # прежняя голова PR (событие synchronize); при открытии PR пусто
          PR_BEFORE: ${{ github.event.before }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            workflow_dispatch) python3 tests/differential/ci/select_routes.py --all --only "$ONLY" ;;
            schedule) python3 tests/differential/ci/select_routes.py --all ;;
            pull_request) python3 tests/differential/ci/select_routes.py --base "$PR_BASE" --head HEAD \
                            --docs-only-since "$PR_BEFORE" --docs-head "$PR_HEAD" ;;
            *) python3 tests/differential/ci/select_routes.py --base "$PUSH_BEFORE" --head HEAD ;;
          esac

  build:
    name: Build nlb_sdl
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/../vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools and Linux graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config git curl zip unzip tar \
            autoconf autoconf-archive automake libtool libltdl-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxss-dev libxt-dev libxv-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols \
            libegl1-mesa-dev libgl1-mesa-dev libdbus-1-dev libibus-1.0-dev \
            libudev-dev libasound2-dev libpulse-dev libsndio-dev libdecor-0-dev \
            libfreetype-dev

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-sdl3-image-ttf-mixer-v1

      - name: Install SDL3 dependencies with vcpkg
        run: |
          git init -q "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" fetch -q --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_COMMIT"
          git -C "$VCPKG_ROOT" checkout -q FETCH_HEAD
          mkdir -p "${{ github.workspace }}/../vcpkg-cache"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          "$VCPKG_ROOT/vcpkg" install \
            sdl3 'sdl3-image[png,jpeg]' sdl3-ttf sdl3-mixer \
            --triplet x64-linux

      - name: Configure and build nlb_sdl
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DNLB_BUILD_APPS=ON \
            -DNLB_WITH_SDL3=ON
          cmake --build build --target nlb_sdl --parallel 4
          test -x build/nlb_sdl

      - name: Smoke-test executable
        run: |
          set +e
          ./build/nlb_sdl > nlb_sdl-usage.log 2>&1
          result=$?
          set -e
          test "$result" -eq 1
          grep -q "Usage: nlb_sdl" nlb_sdl-usage.log
          cat nlb_sdl-usage.log

      - name: Upload nlb_sdl
        uses: actions/upload-artifact@v4
        with:
          name: nlb-sdl-binary
          path: |
            build/nlb_sdl
            build/CMakeCache.txt
            nlb_sdl-usage.log
          retention-days: 3

  route:
    name: ${{ matrix.id }}
    needs: [plan, build, validate]
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pil xvfb xauth instead xdotool imagemagick x11-utils openbox \
            libx11-6 libxext6 libxrandr2 libxcursor1 libxi6 libxinerama1 libxss1 libxkbcommon0 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 libdecor-0-0 \
            libegl1 libgl1 libdbus-1-3 libudev1 libasound2t64 libpulse0 libfreetype6

      - name: Download nlb_sdl
        uses: actions/download-artifact@v4
        with:
          name: nlb-sdl-binary

      - name: Restore test data
        uses: actions/cache@v4
        with:
          path: test-data
          key: test-data-${{ env.GAME_REF }}-${{ env.REFERENCE_REF }}-${{ env.BASE_THEME_REF }}

      - name: Fetch pinned test data
        run: |
          chmod +x build/nlb_sdl
          bash tests/differential/ci/fetch_test_data.sh

      - name: Run in INSTEAD
        id: instead
        continue-on-error: true
        run: |
          output="test-results/${{ matrix.id }}/instead"
          mkdir -p "$output"
          timeout --signal=TERM --kill-after=3s ${{ matrix.instead_timeout }}s \
            xvfb-run -a -s "-screen 0 1920x1080x24" \
            python3 tests/differential/run_route.py \
              --runtime instead \
              --route "${{ matrix.path }}" \
              --game test-data/instead-am_i_a_monster_vn \
              --base-theme test-data/instead/themes/default \
              --output "$output"

      # NLBNavigator идёт и после падения INSTEAD: для разбора нужны отчёты обоих движков
      - name: Run in NLBNavigator
        id: nlbnavigator
        continue-on-error: true
        run: |
          output="test-results/${{ matrix.id }}/nlbnavigator"
          mkdir -p "$output"
          timeout --signal=TERM --kill-after=3s $(( ${{ matrix.nlb_timeout }} + 30 ))s \
            xvfb-run -a -s "-screen 0 1920x1080x24" \
            env SDL_AUDIODRIVER=dummy \
            python3 tests/differential/run_route.py \
              --runtime nlbnavigator \
              --timeout ${{ matrix.nlb_timeout }} \
              --route "${{ matrix.path }}" \
              --player ./build/nlb_sdl \
              --book test-data/wolfman \
              --theme test-data/instead-am_i_a_monster_vn/themes/default \
              --base-theme test-data/instead/themes/default \
              --output "$output"

      - name: Compare INSTEAD and NLBNavigator
        id: compare
        if: steps.instead.outcome == 'success' && steps.nlbnavigator.outcome == 'success'
        continue-on-error: true
        run: |
          python3 tests/differential/run_route.py \
            --runtime compare \
            --route "${{ matrix.path }}" \
            --output "test-results/${{ matrix.id }}"

      - name: Prepare compact diagnostic artifacts
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          from PIL import Image

          source = Path("test-results")
          target = Path("ci-artifacts")
          target.mkdir(exist_ok=True)
          text_suffixes = {".json", ".jsonl", ".tsv", ".txt", ".log", ".script"}
          if source.exists():
              for path in source.rglob("*"):
                  if not path.is_file():
                      continue
                  relative = path.relative_to(source)
                  destination = target / relative
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  if path.suffix.lower() in text_suffixes:
                      shutil.copy2(path, destination)
                  elif path.suffix.lower() == ".png":
                      try:
                          with Image.open(path) as image:
                              image = image.convert("RGB")
                              image.thumbnail((960, 540))
                              destination = destination.with_suffix(".jpg")
                              image.save(destination, "JPEG", quality=78, optimize=True)
                      except Exception as error:
                          print(f"Skipping image {path}: {error}")
          PY

      - name: Upload route results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-${{ matrix.id }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Verdict
        if: always()
        run: |
          echo "INSTEAD: ${{ steps.instead.outcome }}, NLBNavigator: ${{ steps.nlbnavigator.outcome }}, compare: ${{ steps.compare.outcome }}"
          test "${{ steps.instead.outcome }}" = success
          test "${{ steps.nlbnavigator.outcome }}" = success
          test "${{ steps.compare.outcome }}" = success

  report:
    name: Report
    needs: [plan, route]
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download route results
        uses: actions/download-artifact@v4
        with:
          pattern: route-*
          path: route-results
      - name: Merge into nlb-sdl-test-logs
        run: |
          mkdir -p ci-artifacts
          for dir in route-results/route-*; do
            [ -d "$dir" ] && cp -r "$dir"/. ci-artifacts/
          done
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          root = Path("ci-artifacts")
          print("| маршрут | INSTEAD | NLBNavigator | сравнение |")
          print("|---|---|---|---|")
          def state(path):
              if not path.is_file():
                  return "нет отчёта"
              report = json.loads(path.read_text(encoding="utf-8"))
              return "ok" if report.get("ok") else "**ошибка**"
          for route in sorted(p for p in root.iterdir() if p.is_dir()):
              print("| {} | {} | {} | {} |".format(route.name,
                    state(route / "instead/route-report.json"),
                    state(route / "nlbnavigator/route-report.json"),
                    state(route / "comparison-report.json")))
          PY
      - name: Upload nlb-sdl-test-logs
        uses: actions/upload-artifact@v4
        with:
          name: nlb-sdl-test-logs
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14

  gate:
    name: Differential gate
    needs: [validate, plan, build, route, report]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summary
        env:
          VALIDATE: ${{ needs.validate.result }}
          PLAN: ${{ needs.plan.result }}
          BUILD: ${{ needs.build.result }}
          ROUTE: ${{ needs.route.result }}
          REPORT: ${{ needs.report.result }}
          COUNT: ${{ needs.plan.outputs.count }}
          REASON: ${{ needs.plan.outputs.reason }}
        run: |
          {
            echo "### Differential gate"
            echo "validate: $VALIDATE, plan: $PLAN, build: $BUILD, route: $ROUTE, report: $REPORT"
            echo "Маршруты: ${REASON:-не выбраны}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test "$VALIDATE" = success
          test "$PLAN" = success
          if [ "$COUNT" = "0" ]; then
            echo "Маршруты не прогонялись: результат прежних прогонов этой ветки здесь не проверяется." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$BUILD" = success
          test "$ROUTE" = success
