        run: |
          test -s test-data/instead-am_i_a_monster_vn/main.lua
          test -d test-data/instead-am_i_a_monster_vn/images
          test -d test-data/instead-am_i_a_monster_vn/themes
          find test-data/instead-am_i_a_monster_vn/images -type f | grep -q .
          printf 'Reference export structure OK\\n' | tee test-results/reference-validation.log

      - name: Prepare compact diagnostic artifacts
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          from PIL import Image

          source = Path("test-results")
          target = Path("ci-artifacts")
          target.mkdir(exist_ok=True)
          text_suffixes = {".json", ".jsonl", ".tsv", ".txt", ".log", ".script"}
          if source.exists():
              for path in source.rglob("*"):
                  if not path.is_file():
                      continue
                  relative = path.relative_to(source)
                  destination = target / relative
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  if path.suffix.lower() in text_suffixes:
                      shutil.copy2(path, destination)
                  elif path.suffix.lower() == ".png":
                      try:
                          with Image.open(path) as image:
                              image = image.convert("RGB")
                              image.thumbnail((960, 540))
                              destination = destination.with_suffix(".jpg")
                              image.save(destination, "JPEG", quality=78, optimize=True)
                      except Exception as error:
                          print(f"Skipping image {path}: {error}")
          PY

      - name: Upload build and preparation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nlb-sdl-test-logs
          path: |
            nlb_sdl-usage.log
            build/CMakeCache.txt
            ci-artifacts/
          if-no-files-found: warn
          retention-days: 14
